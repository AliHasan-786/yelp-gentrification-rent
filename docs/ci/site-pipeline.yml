name: Verify interactive data pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Regenerate static extracts
        run: python scripts/build_site_data.py

      - name: Verify generated artifacts are committed
        run: git diff --exit-code -- site/data/panel.json site/data/zcta.geojson

      - name: Run data and public-claim tests
        run: python -m unittest discover -s tests -v

      - name: Check browser JavaScript syntax
        run: node --check site/app.js
